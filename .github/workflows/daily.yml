name: Daily pipeline

on:
  # Every day, 13:00 UTC. Cron is always UTC regardless of runner locale —
  # adjust here if you want the run to land at a different local time.
  #
  # Data/site refresh runs daily; the email digest itself still only
  # sends on Mondays (see the "Send digest" step below) — brief section
  # 8's "weekly digest, not real-time alerts" reasoning is specifically
  # about inbox noise from frequent emails, not about how often the
  # underlying facts (price, ownership, delisting status) get re-checked
  # or the site gets rebuilt. Keeping the site always current while the
  # digest stays weekly satisfies both.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      # SEC_USER_AGENT is required for every SEC EDGAR call this job makes
      # (ticker matching, ticker verification's EDGAR fallback, founder
      # filing lookups) — SEC returns 403 without a real one. ANTHROPIC_API_KEY
      # is required for both `run`'s clinical summaries and `run-founders`'
      # extraction. OPENFIGI_API_KEY is optional (matching/ticker_match.py's
      # fallback works without one, just at a lower rate limit) — leaving
      # this secret unset is fine, it resolves to an empty string, which the
      # code already treats the same as "no key".
      #
      # SMTP_HOST/SMTP_PORT are deliberately NOT set here: they default to
      # Gmail (smtp.gmail.com:587) in config.py, and setting an unset GitHub
      # secret still defines the env var as an empty string, which would
      # override that default with "" rather than leaving it alone. Add
      # SMTP_HOST/SMTP_PORT secrets AND matching entries in this env block
      # only if you need a non-Gmail provider.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
      DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Restore db from last committed dump
        run: signal-screener db-restore -v

      - name: Run biotech signal pipeline (FDA + EMA)
        run: signal-screener run -v

      - name: Run founder-led screener
        run: signal-screener run-founders -v

      - name: Check due track-record outcomes (3/6/12mo)
        run: signal-screener check-outcomes -v

      - name: Send digest (Mondays only)
        # The pipeline/site refresh above runs daily, but the email send
        # stays weekly — see the schedule comment above. date -u +%u gives
        # ISO day-of-week (1=Monday..7=Sunday), matching the cron's old
        # "* * 1" day-of-week field this replaced. Also skipped on a
        # manual workflow_dispatch run on a non-Monday, so triggering this
        # by hand to refresh data doesn't unexpectedly email out; run
        # `signal-screener digest -v` locally for an on-demand send.
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            signal-screener digest -v
          else
            echo "Not Monday — skipping digest send (data/site still refreshed daily above)."
          fi

      - name: Generate static site
        run: signal-screener generate-site -v

      - name: Dump db to plain-text SQL
        run: signal-screener db-dump -v

      - name: Commit updated site and db dump if changed
        run: |
          git config user.name "signal-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html data/signal_screener.sql
          git diff --cached --quiet || git commit -m "Daily site + db refresh $(date -u +%Y-%m-%d)"
          git push
