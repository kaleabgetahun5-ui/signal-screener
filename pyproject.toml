[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-screener"
version = "0.1.0"
description = "Biotech signal screener - Step 1: FDA Breakthrough Therapy pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.6",
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
signal-screener = "signal_screener.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
